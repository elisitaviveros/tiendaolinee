<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda de Maquillaje</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5dc;
      margin: 0;
      padding: 0;
      color: #333;
    }
    header {
      background-color: #bb8fce;
      padding: 20px;
      text-align: center;
      color: white;
    }
    .product-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }
    .product {
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 250px;
      text-align: center;
      padding: 15px;
    }
    .product img {
      width: 100%;
      border-radius: 8px;
    }
    .product h3 {
      font-size: 20px;
      color: #bb8fce;
    }
    .product p {
      font-size: 16px;
      color: #555;
    }
    .price {
      font-size: 18px;
      font-weight: bold;
      color: #d8a7a1;
    }

    .btn {
      background-color: #d7bde2; /* morado claro */
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
      margin: 10px 5px 10px 5px;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background-color: #c39bd3; /* morado un poco más oscuro */
    }

    #contenido-carrito {
      background-color: #e0d4f5;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      margin: 20px auto;
      text-align: left;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }
    #contenido-carrito p {
      margin: 8px 0;
      font-size: 18px;
    }
    #botones-carrito {
      max-width: 400px;
      margin: 10px auto 40px auto;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <div class="product-container">
      <a href="index.html" class="btn">Inicio</a>
      <a href="historia.html" class="btn">Conócenos</a>
      <a href="maquillaje.html" class="btn">Maquillaje</a>
      <a href="skinker.html" class="btn">Skincare</a>
      <a href="fragancias.html" class="btn">Fragancias</a>
      <a href="secion.html" class="btn">Únete</a>
      <a href="carritoo.html" class="btn">Carrito</a>
    </div>
  </header>

  <div id="contenido-carrito"></div>

  <div id="botones-carrito">
    <button class="btn" id="btnPagar">Pagar</button>
    <button class="btn" id="btnBorrar">Borrar</button>
  </div>

  <script>
    window.onload = function () {
      mostrarCarrito();
    };

    function agregarAlCarrito(nombre, precio) {
      let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
      carrito.push({ nombre, precio });
      localStorage.setItem('carrito', JSON.stringify(carrito));
      mostrarCarrito();
      alert(`${nombre} ha sido agregado al carrito.`);
    }

    function mostrarCarrito() {
      const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
      const contenedor = document.getElementById('contenido-carrito');
      contenedor.innerHTML = ''; // limpiar contenido antes de mostrar

      if (carrito.length === 0) {
        contenedor.innerHTML = '<p>Tu carrito está vacío.</p>';
      } else {
        let total = 0;
        carrito.forEach(producto => {
          const p = document.createElement('p');
          p.textContent = `${producto.nombre} - $${producto.precio}`;
          contenedor.appendChild(p);
          total += producto.precio;
        });
        const totalP = document.createElement('p');
        totalP.innerHTML = `<strong>Total: $${total}</strong>`;
        contenedor.appendChild(totalP);
      }
    }

    // Botón Pagar: redirige a la página de pago
    document.getElementById('btnPagar').addEventListener('click', function() {
      const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
      if (carrito.length === 0) {
        alert('El carrito está vacío. Agrega productos antes de pagar.');
      } else {
        window.location.href = 'pago.html';
      }
    });

    // Botón Borrar: limpia el carrito
    document.getElementById('btnBorrar').addEventListener('click', function() {
      if (confirm('¿Seguro que quieres borrar todos los productos del carrito?')) {
        localStorage.removeItem('carrito');
        mostrarCarrito();
      }
    });
  </script>
</body>
</html>
